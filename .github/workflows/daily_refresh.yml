name: Daily Public Credit Refresh

on:
  schedule:
    # 22:00 UTC = after the US Treasury par-yield publish (~4pm ET) and FRED's
    # DGS update, so the same-day close is available. (18:00 UTC ran before the
    # close and only ever captured the prior day.)
    - cron: '0 22 * * *'
  workflow_dispatch:
    # Also allow manual trigger from Actions tab
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual daily refresh trigger'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # FRED API key – set this once in Settings → Secrets → Actions → New repository secret
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # Optional: add other free-tier keys here if needed
      # FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
      # FINRA_API_SECRET: ${{ secrets.FINRA_API_SECRET }}
      # ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      # ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}

    steps:
      # ---- 1. Checkout repo ----
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for later push

      # ---- 2. Set up Python ----
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ---- 3. Install dependencies ----
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # ---- 4. Force fresh upstream reads ----
      # Cache files are content-hash named (data/cache/<sha1>.json), so the old
      # `rm -rf data/cache/fred*` matched nothing. Worse, a freshly checked-out
      # cache carries the checkout mtime, which the Python TTL test reads as
      # "just fetched" — so day-old cached values were reused and the data
      # froze (e.g. the Treasury curve stuck at its captured date). Age every
      # cached file so the loaders re-fetch and rewrite it.
      - name: Force fresh upstream reads (age the cache)
        run: |
          find data/cache -type f -exec touch -t 200001010000 {} + 2>/dev/null || true
          echo "Aged $(find data/cache -type f | wc -l) cache files so upstreams re-fetch"

      # ---- 5. Verify FRED API key is set ----
      - name: Check FRED API key
        run: |
          if [ -z "${FRED_API_KEY}" ]; then
            echo "❌ FRED_API_KEY is empty. Please set the secret in GitHub Secrets."
            exit 1
          fi
          echo "✅ FRED_API_KEY is set (length: ${#FRED_API_KEY})"

      # ---- 6. Quick test: fetch DGS10 to verify FRED works ----
      - name: Test FRED fetch (DGS10)
        run: |
          cd "$GITHUB_WORKSPACE"
          source .venv/bin/activate
          export FRED_API_KEY="${{ env.FRED_API_KEY }}"
          python - <<'PY'
          import sys
          from engine.data_engine import fetch_fred_series
          s = fetch_fred_series("DGS10")
          if s.empty:
              print("❌ DGS10 fetch returned empty series")
              sys.exit(1)
          print(f"✅ DGS10 latest: {s.index.max().date()} = {s.iloc[-1]:.4f}%")
          PY

      # ---- 7. Run daily refresh script ----
      - name: Execute daily refresh
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          source .venv/bin/activate
          export FRED_API_KEY="${{ env.FRED_API_KEY }}"
          bash scripts/daily_refresh.sh

      # ---- 8. Show atlas summary (debug) ----
      - name: Show atlas summary
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f data/atlas.json ]; then
            echo "Atlas generated at: $(jq -r .generated data/atlas.json 2>/dev/null || echo 'unknown')"
            # US 10y yield from bond_curve
            us_10y=$(jq -r '.countries["US"].instruments.bond_curve["10y_pct"] // empty' data/atlas.json 2>/dev/null)
            if [ -n "$us_10y" ]; then
              echo "US 10y yield: ${us_10y}%"
            else
              echo "US 10y yield: not found in atlas"
            fi
          else
            echo "❌ atlas.json not found"
          fi

      # ---- 9. Git push (if changes exist) ----
      - name: Push changes to GitHub
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # daily_refresh.sh stages the regenerated data files; they must be
            # committed before pushing — a bare `git push` sends no changes.
            git commit -m "daily refresh: $(date -u +%Y-%m-%d) automated data refresh"
            # Use the built‑in GITHUB_TOKEN for pushing (no PAT needed for same‑repo pushes)
            git push origin master
            echo "Changes committed and pushed to GitHub master"
          else
            echo "No changes detected — nothing to push"
          fi

      # ---- 10. Vercel auto-deploys on push ----
      # Note: Vercel is configured to deploy on pushes to master branch.
      # The vercel.json already includes: "includeFiles": "public/data/**"
      # So bundle.json, status.json, atlas.json etc. are automatically picked up.
      - name: Verify Vercel deployment trigger
        run: |
          echo "✅ On push to master, Vercel auto-deploys using web/public/data/ files"
          echo "✅ bundle.json and status.json in web/public/data/ are the committed fallbacks"
          echo "✅ API handlers in web/api/ read from these files via file fallback"
